name: Publish
on:
  push:
    tags:
      - v*
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    name: Publish
    steps:
      - uses: holepunchto/actions/python-base@v1
      - uses: holepunchto/actions/publish-pypi@v1
