name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
    environment:
      name: pypi
    name: Publish
    steps:
      - uses: holepunchto/actions/python-base@v1
      - uses: holepunchto/actions/publish-pypi@v1
