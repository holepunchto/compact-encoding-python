[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compact-encoding-python"
version = "0.0.1"
description = "Pure-Python port of the compact-encoding binary wire codec"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Holepunch" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/compact_encoding"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
