[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compact-encoding"
version = "0.1.0"
description = "Compact encoding schemes for Python"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Holepunch" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/holepunchto/compact-encoding-python"
Repository = "https://github.com/holepunchto/compact-encoding-python"
Issues = "https://github.com/holepunchto/compact-encoding-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/compact_encoding"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
